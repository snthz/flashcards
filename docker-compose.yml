services:
  flashcards:
    image: ${FLASHCARDS_IMAGE:-ghcr.io/snthz/flashcards:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MEDIA_DIR: /app/data/media
      TZ: ${TZ:-UTC}
      APP_URL: ${APP_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - flashcards-media:/app/data/media
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  flashcards-media:

networks:
  dokploy-network:
    external: true
